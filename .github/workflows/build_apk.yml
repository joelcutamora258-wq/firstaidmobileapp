name: Build Android APK

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Prepare Environment
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          elif [ ! -f .env ]; then
            echo "GEMINI_API_KEY=dummy_ci_key" > .env
          fi

          touch local.properties

      - name: Check Project Files
        run: |
          echo "=== Project structure ==="
          ls -la

          echo "=== Gradle files ==="
          find . -maxdepth 3 \
            \( -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "gradle-wrapper.properties" \
            -o -name "gradlew" \) \
            -print

      - name: Verify Gradle Wrapper
        run: |
          test -f ./gradlew
          test -f ./gradle/wrapper/gradle-wrapper.properties
          chmod +x ./gradlew

      - name: Show Gradle Version
        run: |
          ./gradlew --version

      - name: Show Android Tasks
        run: |
          ./gradlew tasks --stacktrace --no-daemon

      - name: Build Debug APK
        env:
          GRADLE_OPTS: "-Djava.awt.headless=true"
        run: |
          ./gradlew :app:assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Find APK
        if: success()
        run: |
          echo "=== APK files ==="
          find . -type f -name "*.apk" -print

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FirstAid-App-Debug
          path: |
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
