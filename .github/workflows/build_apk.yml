name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Prepare Environment
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            echo "GEMINI_API_KEY=dummy_ci_key" > .env
          fi

          touch local.properties

      - name: Make Gradle Wrapper Executable
        run: |
          if [ ! -f ./gradlew ]; then
            echo "ERROR: gradlew is missing from the repository."
            echo "Please generate and commit the Gradle wrapper locally."
            exit 1
          fi

          chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        env:
          GRADLE_OPTS: "-Djava.awt.headless=true -Dksp.use.daemon=false"
        run: |
          ./gradlew assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FirstAid-App-Debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
