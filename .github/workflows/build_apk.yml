name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Initialize Environment & Configuration Files
        run: |
          touch local.properties
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            echo "GEMINI_API_KEY=dummy_ci_key" > .env
          fi

      - name: Ensure Executable Gradle Wrapper
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
          else
            gradle wrapper
            chmod +x gradlew
          fi

      - name: Build Debug APK
        env:
          GRADLE_OPTS: "-Djava.awt.headless=true -Dksp.use.daemon=false"
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate and Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FirstAid-App-Debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
